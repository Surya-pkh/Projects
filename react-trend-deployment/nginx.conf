events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    server {
        listen 3000;
        server_name localhost;
        
        root /usr/share/nginx/html;
        index index.html;
        
        # Handle React Router
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Nginx status/metrics endpoint for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }
        
        # Basic metrics endpoint (for Prometheus)
        location = /metrics {
            access_log off;
            default_type text/plain;
            return 200 "# HELP nginx_up Nginx status\n# TYPE nginx_up gauge\nnginx_up 1\n# HELP nginx_requests_total Total requests\n# TYPE nginx_requests_total counter\nnginx_requests_total{status=\"200\"} 1\n";
        }
        
        # Cache static assets
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
